<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planilha de Usuários - ADM</title>
  <link rel="stylesheet" href="./estilo.css?v=11">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .admin-container {
      width: 90%;
      max-width: 900px;
      margin: 40px auto;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--border-radius);
      padding: 24px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
    }
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .admin-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    .admin-table th, .admin-table td {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .admin-table th {
      background: rgba(20, 24, 35, 0.6);
      color: var(--text-muted);
      font-size: 0.85rem;
      text-transform: uppercase;
    }
    .badge-adm {
      background: #5850ec;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
    }
    .btn-back {
      color: var(--text-main);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.1);
      padding: 8px 16px;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div class="admin-container">
    <div class="admin-header">
      <h2><i class="fa-solid fa-table"></i> Planilha de Usuários Cadastrados</h2>
      <a href="./index.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i> Voltar</a>
    </div>

    <table class="admin-table">
      <thead>
        <tr>
          <th>Usuário</th>
          <th>E-mail</th>
          <th>Nível de Acesso</th>
        </tr>
      </thead>
      <tbody id="users-table-body">
        <!-- Preenchido via JS -->
      </tbody>
    </table>
  </div>

  <script>
    const defaultUsers = [
      { username: "henrique", email: "henriquealvesribeiro882@gmail.com", isAdmin: true },
      { username: "henrique", email: "halvz876@gmail.com", isAdmin: true },
      { username: "henrique", email: "havz876@gmail.com", isAdmin: true },
      { username: "adm1", email: "adm1@gmail.com", isAdmin: true },
      { username: "adm2", email: "adm2@gmail.com", isAdmin: true }
    ];

    const stored = localStorage.getItem('app_users');
    const users = stored ? JSON.parse(stored) : defaultUsers;
    const tbody = document.getElementById('users-table-body');

    tbody.innerHTML = users.map(u => `
      <tr>
        <td><strong>${u.username}</strong></td>
        <td>${u.email}</td>
        <td>${u.isAdmin ? '<span class="badge-adm">ADMIN</span>' : 'Usuário'}</td>
      </tr>
    `).join('');
  </script>
</body>
</html>
