<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Nova Conta</title>
    <link rel="stylesheet" href="estilo.css">
    <link rel="stylesheet" href="./estilo.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #141823;
        color: #fff;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      .auth-card {
        background: rgba(37, 42, 56, 0.85);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        padding: 30px;
        width: 100%;
        max-width: 400px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
      }
      .auth-card h2 {
        text-align: center;
        margin-bottom: 24px;
        font-size: 1.5rem;
      }
      .input-group {
        margin-bottom: 16px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .input-group label {
        font-size: 0.85rem;
        color: #a0a6b5;
      }
      .input-group input {
        width: 100%;
        padding: 12px;
        background-color: #2e3546;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        color: #fff;
        outline: none;
        box-sizing: border-box;
      }
      .btn-primary {
        background: #5850ec;
        color: #fff;
        border: none;
        padding: 12px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        width: 100%;
        transition: background 0.2s;
      }
      .btn-primary:hover {
        background: #463fd4;
      }
      .btn-secondary {
        background: transparent;
        border: 1px solid #5850ec;
        color: #fff;
        padding: 10px;
        border-radius: 8px;
        cursor: pointer;
        width: 100%;
        text-align: center;
        text-decoration: none;
        display: block;
        box-sizing: border-box;
      }
    </style>
</head>
<body>

  <main class="view">
    <section class="auth-card">
        <h2>Criar Nova Conta</h2>
        <form id="form-cadastro">

            <div class="input-group">
                <label for="cad-nome">Username:</label>
                <input type="text" id="cad-nome" placeholder="Digite seu nome" required>
            </div>

            <div class="input-group">
                <label for="cad-email">E-mail:</label>
                <input type="email" id="cad-email" placeholder="Digite seu e-mail" required>
            </div>

            <div class="input-group">
                <label for="cad-senha">Senha:</label>
                <div class="password-wrapper" style="position: relative; display: flex; align-items: center;">
                    <input type="password" id="cad-senha" placeholder="Crie uma senha" required style="width: 100%; padding: 12px; padding-right: 40px; background-color: #2e3546; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; color: #fff; outline: none; box-sizing: border-box;">
                    <span id="toggleCadSenha" class="toggle-password" style="position: absolute; right: 12px; cursor: pointer; color: #a0a6b5;"><i class="fa-solid fa-eye"></i></span>
                </div>
            </div>

            <div class="auth-actions" style="margin-top: 20px; display: flex; flex-direction: column; gap: 10px;">
                <button type="submit" id="btnCadastrar" class="btn-primary">Cadastrar</button>
                <a href="index.html" class="btn-secondary">Voltar ao Login</a>
            </div>
        </form>
    </section>
  </main>

  <script>
    // Olinho da senha
    const toggleCadSenha = document.getElementById("toggleCadSenha");
    const inputCadSenha = document.getElementById("cad-senha");
    if (toggleCadSenha && inputCadSenha) {
      toggleCadSenha.addEventListener("click", () => {
        const tipo = inputCadSenha.getAttribute("type") === "password" ? "text" : "password";
        inputCadSenha.setAttribute("type", tipo);
        toggleCadSenha.innerHTML = tipo === "password" ? '<i class="fa-solid fa-eye"></i>' : '<i class="fa-solid fa-eye-slash"></i>';
      });
    }
  </script>

  <script type="module">
    import { auth, db } from "./firebase-config.js";
    import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    document.getElementById("form-cadastro").addEventListener("submit", async (e) => {
      e.preventDefault();
      const nome = document.getElementById("cad-nome").value.trim();
      const email = document.getElementById("cad-email").value.trim().toLowerCase();
      const senha = document.getElementById("cad-senha").value.trim();

      try {
        // 1. Cria a conta no Firebase Authentication
        const userCredential = await createUserWithEmailAndPassword(auth, email, senha);
        const user = userCredential.user;

        // 2. Salva o perfil padrão como usuário comum no Firestore
        await setDoc(doc(db, "usuários", user.uid), {
          nome: nome,
          email: email,
          nivel: "usuario"
        });

        alert("Conta criada com sucesso! Você já pode fazer login.");
        window.location.href = "index.html";
      } catch (error) {
        alert("Erro ao cadastrar: " + error.message);
      }
    });
  </script>
</body>
</html>
