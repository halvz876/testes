<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="estilo.css?v=4">
</head>
<body>
    <div class="container">
        <h2>CRIAR CONTA</h2>

        <div class="campo">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" placeholder="Digite seu nome">
        </div>

        <div class="campo">
            <label for="email">E-mail:</label>
            <input type="email" id="email" placeholder="Digite seu e-mail">
        </div>

        <div class="campo">
            <label for="senha">Senha:</label>
            <div class="campo-senha">
                <input type="password" id="senha" placeholder="Crie uma senha">
                <span id="toggleSenha" class="toggle-senha">👁️</span>
            </div>
        </div>

        <button id="btnCadastrar">CADASTRAR</button>

        <div class="links">
            <p>Já tem uma conta? <a href="index.html">Fazer Login</a></p>
        </div>
    </div>

    <script type="module" src="cadastro.js"></script>
</body>
</html>
