<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Nova Conta</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <div class="container">
        <form id="form-cadastro">
            <h2>Criar Nova Conta</h2>

            <div class="campo">
                <label for="cad-nome">Username:</label>
                <input type="text" id="cad-nome" placeholder="Digite seu nome" required>
            </div>

            <div class="campo">
                <label for="cad-email">E-mail:</label>
                <input type="email" id="cad-email" placeholder="Digite seu e-mail" required>
            </div>

            <div class="campo">
                <label for="cad-senha">Senha:</label>
                <input type="password" id="cad-senha" placeholder="Crie uma senha" required>
            </div>

            <div class="campo">
                <label for="cad-nivel">Nível de Acesso:</label>
                <select id="cad-nivel" style="width: 100%; padding: 10px; margin-top: 5px; background-color: #2b2d42; color: #fff; border: 1px solid #4a4e69; border-radius: 4px;">
                    <option value="usuario">Usuário Comum</option>
                    <option value="adm1">ADM Nível 1</option>
                    <option value="adm2">ADM Nível 2</option>
                </select>
            </div>

            <button type="submit" id="btnCadastrar" style="margin-top: 15px;">Cadastrar</button>
            
            <div style="text-align: center; margin-top: 15px;">
                <a href="index.html" style="color: #a5b4fc; text-decoration: none;">Voltar ao Login</a>
            </div>
        </form>
    </div>

    <script type="module" src="cadastro.js"></script>
</body>
</html>
