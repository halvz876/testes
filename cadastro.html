<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Nova Conta</title>
    <link rel="stylesheet" href="./estilo.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- VIEW DE CADASTRO -->
  <main class="view">
    <section class="auth-card">
        <h2>Criar Nova Conta</h2>
        <form id="form-cadastro">

            <div class="input-group">
                <label for="cad-nome">Username:</label>
                <input type="text" id="cad-nome" placeholder="Digite seu nome" required>
            </div>

            <div class="input-group">
                <label for="cad-email">E-mail:</label>
                <input type="email" id="cad-email" placeholder="Digite seu e-mail" required>
            </div>

            <div class="input-group">
                <label for="cad-senha">Senha:</label>
                <div class="password-wrapper" style="position: relative; display: flex; align-items: center;">
                    <input type="password" id="cad-senha" placeholder="Crie uma senha" required style="width: 100%; padding: 12px; padding-right: 40px; background-color: var(--input-bg, #2e3546); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; color: #fff; outline: none;">
                    <span id="toggleCadSenha" class="toggle-password" style="position: absolute; right: 12px; cursor: pointer; color: #a0a6b5;"><i class="fa-solid fa-eye"></i></span>
                </div>
            </div>

            <div class="input-group">
                <label for="cad-nivel">Nível de Acesso:</label>
                <select id="cad-nivel" style="width: 100%; padding: 12px; background-color: var(--input-bg, #2e3546); color: #fff; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; outline: none;">
                    <option value="usuario">Usuário Comum</option>
                    <option value="adm1">ADM Nível 1</option>
                    <option value="adm2">ADM Nível 2</option>
                </select>
            </div>

            <div class="auth-actions" style="margin-top: 16px; display: flex; flex-direction: column; gap: 10px;">
                <button type="submit" id="btnCadastrar" class="btn-primary">Cadastrar</button>
                <button type="button" class="btn-secondary" onclick="window.location.href='index.html'" style="background: transparent; border: 1px solid #5850ec; color: #fff; padding: 10px; border-radius: 8px; cursor: pointer;">Voltar ao Login</button>
            </div>
        </form>
    </section>
  </main>

  <!-- SCRIPT DE SUPORTE AO OLINHO NA TELA DE CADASTRO -->
  <script>
    const toggleCadSenha = document.getElementById("toggleCadSenha");
    const inputCadSenha = document.getElementById("cad-senha");
    
    if (toggleCadSenha && inputCadSenha) {
      toggleCadSenha.addEventListener("click", () => {
        const tipo = inputCadSenha.getAttribute("type") === "password" ? "text" : "password";
        inputCadSenha.setAttribute("type", tipo);
        toggleCadSenha.innerHTML = tipo === "password" ? '<i class="fa-solid fa-eye"></i>' : '<i class="fa-solid fa-eye-slash"></i>';
      });
    }
  </script>

  <script type="module" src="cadastro.js"></script>
</body>
</html>
