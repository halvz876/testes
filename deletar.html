<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="estilo.css">
    <title>Excluir Conta</title>
</head>
<body>
    <form id="formDeletarContaPropria">
        <fieldset id="delConta">
            <legend>EXCLUIR MINHA CONTA COMPLETA</legend>
            <p>
                <label>E-mail:</label>
                <input type="email" id="deletarEmailAuth" required>
            </p>
            <p>
                <label>Senha:</label>
                <input type="password" id="deletarSenhaAuth" required>
            </p>
            <center>
                <button type="submit">EXCLUIR MINHA CONTA PERMANENTEMENTE</button>
            </center>
            <div class="links-navegacao">
                <p><a href="index.html">Voltar ao Login</a></p>
            </div>
        </fieldset>
    </form>
  <button id="btnDeletar">Excluir Minha Conta</button>

<script type="module" src="deletar.js"></script>
</body>
</html>
