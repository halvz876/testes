<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login e Sistema Seguro</title>
  <link rel="stylesheet" href="./estilo.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="profile-container">
      <button class="icon-btn" id="btnPerfil"><i class="fa-solid fa-user"></i></button>
      <div class="dropdown-menu hidden" id="menuPerfil">
        <div class="user-info">
          <span class="profile-avatar"><i class="fa-solid fa-user-circle"></i></span>
          <div>
            <strong id="perfilNome">Visitante</strong>
            <span class="status-online" id="statusOnline">● Offline</span>
          </div>
        </div>
        <hr class="dropdown-divider">
        <ul class="menu-list">
          <!-- O Painel só aparece para Administradores após o login -->
          <li id="menuPainelItem" class="hidden"><a href="./admin.html"><i class="fa-solid fa-table"></i> Painel de Usuários</a></li>
          <li id="menuEditarItem" class="hidden"><a href="./editar.html"><i class="fa-solid fa-user-pen"></i> Editar Conta</a></li>
          <li id="menuDeletarItem" class="hidden"><a href="./deletar.html"><i class="fa-solid fa-trash-can"></i> Excluir Conta</a></li>
        </ul>
      </div>
    </div>

    <div class="menu-container">
      <button class="icon-btn" id="btnMenu"><i class="fa-solid fa-gear"></i></button>
      <div class="dropdown-content hidden" id="menuOpcoes">
        <div class="dropdown-header">Opções</div>
        <a href="./cadastro.html">Criar Conta</a>
        <a href="#" id="linkSair" class="hidden">Sair da Conta</a>
      </div>
    </div>
  </header>

  <!-- VIEW DE LOGIN -->
  <main class="view">
    <section id="telaLogin" class="auth-card">
      <h2>LOGIN</h2>
      <form id="formLogin">
        <div class="input-group">
          <label>Login (Email):</label>
          <input type="email" id="loginEmail" required placeholder="seu@email.com">
        </div>
        <div class="input-group">
          <label>SENHA:</label>
          <div class="password-wrapper" style="position: relative; display: flex; align-items: center;">
            <input type="password" id="loginSenha" required placeholder="Sua senha" style="width: 100%; padding: 12px; padding-right: 40px; background-color: var(--input-bg, #2e3546); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; color: #fff; outline: none;">
            <span id="toggleLoginSenha" class="toggle-password" style="position: absolute; right: 12px; cursor: pointer; color: #a0a6b5;"><i class="fa-solid fa-eye"></i></span>
          </div>
        </div>
        <div class="auth-actions" style="margin-top: 16px; display: flex; flex-direction: column; gap: 10px;">
          <button type="submit" class="btn-primary">FAZER LOGIN</button>
          <button type="button" class="btn-secondary" onclick="window.location.href='cadastro.html'" style="background: transparent; border: 1px solid #5850ec; color: #fff; padding: 10px; border-radius: 8px; cursor: pointer;">Não tem conta? Cadastre-se</button>
        </div>
      </form>
    </section>
  </main>

  <!-- SCRIPT DE AUTENTICAÇÃO E CONTROLE -->
  <script type="module">
    import { auth, db } from "./firebase-config.js";
    import { signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // Olinho (Mostrar/Esconder Senha)
    const toggleSenha = document.getElementById("toggleLoginSenha");
    const inputSenha = document.getElementById("loginSenha");
    
    if (toggleSenha && inputSenha) {
      toggleSenha.addEventListener("click", () => {
        const tipo = inputSenha.getAttribute("type") === "password" ? "text" : "password";
        inputSenha.setAttribute("type", tipo);
        toggleSenha.innerHTML = tipo === "password" ? '<i class="fa-solid fa-eye"></i>' : '<i class="fa-solid fa-eye-slash"></i>';
      });
    }

    // Menus Dropdown
    const btnPerfil = document.getElementById("btnPerfil");
    const menuPerfil = document.getElementById("menuPerfil");
    const btnMenu = document.getElementById("btnMenu");
    const menuOpcoes = document.getElementById("menuOpcoes");

    btnPerfil.addEventListener("click", (e) => {
      e.stopPropagation();
      menuPerfil.classList.toggle("hidden");
      menuOpcoes.classList.add("hidden");
    });

    btnMenu.addEventListener("click", (e) => {
      e.stopPropagation();
      menuOpcoes.classList.toggle("hidden");
      menuPerfil.classList.add("hidden");
    });

    window.addEventListener("click", () => {
      menuPerfil.classList.add("hidden");
      menuOpcoes.classList.add("hidden");
    });

    // Estado do Usuário / Login / Verificação de Admin
    const perfilNome = document.getElementById("perfilNome");
    const statusOnline = document.getElementById("statusOnline");
    const menuPainelItem = document.getElementById("menuPainelItem");
    const menuEditarItem = document.getElementById("menuEditarItem");
    const menuDeletarItem = document.getElementById("menuDeletarItem");
    const linkSair = document.getElementById("linkSair");

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        perfilNome.textContent = user.email;
        statusOnline.textContent = "● Online";
        statusOnline.style.color = "#10b981";
        linkSair.classList.remove("hidden");
        menuEditarItem.classList.remove("hidden");
        menuDeletarItem.classList.remove("hidden");

        // Buscar dados no Firestore para verificar se é ADMIN
        try {
          const docRef = doc(db, "usuarios", user.uid);
          const docSnap = await getDoc(docRef);
          
          if (docSnap.exists()) {
            const dados = docSnap.data();
            perfilNome.textContent = dados.nome || user.email;
            
            // Regra: A planilha só aparece se for admin
            if (dados.nivel === "adm1" || dados.nivel === "adm2" || dados.isAdmin === true) {
              menuPainelItem.classList.remove("hidden");
            }
          }
        } catch (error) {
          console.error("Erro ao verificar privilégios de admin:", error);
        }
      } else {
        perfilNome.textContent = "Visitante";
        statusOnline.textContent = "● Offline";
        statusOnline.style.color = "#a0a6b5";
        linkSair.classList.add("hidden");
        menuPainelItem.classList.add("hidden");
        menuEditarItem.classList.add("hidden");
        menuDeletarItem.classList.add("hidden");
      }
    });

    // Ação de Login
    document.getElementById("formLogin").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("loginEmail").value.trim();
      const senha = inputSenha.value;

      try {
        await signInWithEmailAndPassword(auth, email, senha);
        alert("Login realizado com sucesso!");
        window.location.reload();
      } catch (error) {
        alert("Erro ao entrar: " + error.message);
      }
    });

    // Ação de Sair
    linkSair.addEventListener("click", async (e) => {
      e.preventDefault();
      await signOut(auth);
      alert("Você saiu da conta.");
      window.location.reload();
    });
  </script>
</body>
</html>
