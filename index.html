<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="estilo.css?v=4">
</head>
<body>
    <div class="container">
        <h2>LOGIN</h2>
        
        <div class="campo">
            <label for="email">Login (Email):</label>
            <input type="email" id="email" placeholder="Digite seu e-mail">
        </div>

        <div class="campo">
            <label for="senha">Senha:</label>
            <div class="campo-senha">
                <input type="password" id="senha" placeholder="Digite sua senha">
                <span id="toggleSenha" class="toggle-senha">👁️</span>
            </div>
        </div>

        <button id="btnLogin">FAZER LOGIN</button>

        <div class="links">
            <p>Não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
            <a href="deletar.html" class="link-excluir">Quero excluir minha conta</a>
        </div>
    </div>
    <script type="module" src="login.js?v=2"></script>
</body>
</html>
