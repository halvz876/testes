<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

    <div class="login-container">
        <h2>LOGIN</h2>
        
        <!-- Formulário de Login -->
        <form id="formLogin">
            <div class="campo">
                <label for="loginEmail">Login (Email):</label>
                <input type="email" id="loginEmail" placeholder="Digite seu e-mail" required>
            </div>

            <div class="campo">
                <label for="loginSenha">Senha:</label>
                <div style="position: relative; display: flex; align-items: center;">
                    <input type="password" id="loginSenha" placeholder="Digite sua senha" required style="width: 100%; padding-right: 40px;">
                    <button type="button" id="btnToggleSenha" style="position: absolute; right: 10px; background: none; border: none; cursor: pointer; color: #fff; font-size: 16px;">
                        👁️
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-primary">FAZER LOGIN</button>
        </form>

        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #2a2d3d;">

        <!-- Links e Ações Adicionais -->
        <div class="links-rodape" style="text-align: center;">
            <p>Não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
            
            <button type="button" id="btnAbrirDeletar" style="background: none; border: none; color: #ff4d4d; cursor: pointer; font-weight: bold; margin-top: 15px; text-decoration: underline;">
                Quero excluir minha conta
            </button>
        </div>

        <!-- Caixinha Escondida para Exclusão de Conta -->
        <div id="boxDeletar" style="display: none; margin-top: 20px; padding: 15px; background-color: #1a1c23; border: 1px solid #ff4d4d; border-radius: 8px;">
            <h3 style="color: #ff4d4d; margin-top: 0;">Confirmar Exclusão</h3>
            <p style="font-size: 13px; color: #ccc;">Digite suas credenciais para apagar permanentemente sua conta:</p>

            <div class="campo">
                <input type="email" id="deletarEmail" placeholder="Confirme seu e-mail">
            </div>
            <div class="campo" style="margin-top: 10px;">
                <input type="password" id="deletarSenha" placeholder="Confirme sua senha">
            </div>

            <button type="button" id="btnConfirmarDeletar" style="background-color: #ff4d4d; color: white; border: none; width: 100%; padding: 10px; margin-top: 12px; cursor: pointer; border-radius: 5px; font-weight: bold;">
                APAGAR MINHA CONTA AGORA
            </button>
        </div>
    </div>

    <!-- Script principal de Login -->
    <script type="module" src="login.js"></script>
</body>
</html>
