<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="estilo.css">
    <title>Login</title>
</head>
<body>
    <form id="formLogin">
        <fieldset>
            <legend>LOGIN</legend>
            <p>
                <label>Login (Email):</label>
                <input type="email" id="loginEmail" required>
            </p>
            <p>
                <label>Senha:</label>
                <input type="password" id="loginSenha" required>
            </p>
            <center>
                <button type="submit">FAZER LOGIN</button>
            </center>
            
            <div class="links-navegacao" style="text-align: center; margin-top: 15px;">
                <p>Não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
                
                <!-- Botão vermelho dentro do bloco -->
                <p style="margin-top: 10px;">
                    <button type="button" id="btnAbrirDeletar" style="background: none; border: none; color: #ff4d4d; cursor: pointer; font-weight: bold; text-decoration: underline;">
                        Quero excluir minha conta
                    </button>
                </p>
            </div>

            <!-- Campos que aparecem ao clicar no botão -->
            <div id="boxDeletar" style="display: none; margin-top: 15px; padding: 10px; background: rgba(255,255,255,0.05); border-radius: 8px;">
                <p style="color: #ff4d4d; font-weight: bold; margin-bottom: 8px;">Excluir Conta</p>
                <p>
                    <input type="email" id="deletarEmail" placeholder="Digite seu e-mail para confirmar" style="width: 100%; margin-bottom: 8px;" />
                </p>
                <p>
                    <input type="password" id="deletarSenha" placeholder="Digite sua senha" style="width: 100%; margin-bottom: 8px;" />
                </p>
                <button type="button" id="btnConfirmarDeletar" style="background-color: #ff4d4d; color: white; border: none; padding: 8px 12px; width: 100%; cursor: pointer; border-radius: 4px;">
                    Confirmar Exclusão
                </button>
            </div>
        </fieldset>
    </form>

    <script type="module" src="login.js"></script>
</body>
</html>
