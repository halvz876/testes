<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plataforma de Jogos</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- CABEÇALHO FIXO (Oculto na tela de Login) -->
  <header class="navbar hidden" id="main-navbar">
    <div class="nav-left">
      <button class="icon-btn" id="btn-profile" title="Perfil">
        <i class="fa-solid fa-user"></i>
      </button>
      <button class="icon-btn" id="btn-search-page" title="Buscar">
        <i class="fa-solid fa-magnifying-glass"></i>
      </button>
    </div>
    <div class="nav-right">
      <button class="icon-btn" id="btn-options" title="Mais opções">
        <i class="fa-solid fa-ellipsis-vertical"></i>
      </button>
    </div>
  </header>

  <!-- MENU DROPDOWN DE PERFIL -->
  <div class="dropdown-menu hidden" id="profile-menu">
    <div class="user-info">
      <i class="fa-solid fa-circle-user profile-avatar"></i>
      <div>
        <h4 id="user-nickname">nickname</h4>
        <p id="user-email">email@gmail.com</p>
        <span class="status-online"><i class="fa-solid fa-circle"></i> Online</span>
      </div>
    </div>
    <hr>
    <ul class="menu-list">
      <li><a href="#"><i class="fa-solid fa-envelope"></i> Caixa de Mensagens</a></li>
      <li><a href="#"><i class="fa-solid fa-user-plus"></i> Adicionar Amigo</a></li>
      <li><a href="#"><i class="fa-solid fa-users"></i> Ver Amigos</a></li>
    </ul>
    <hr>
    <ul class="menu-list danger-zone">
      <li><button id="btn-logout"><i class="fa-solid fa-right-from-bracket"></i> Sair da Conta</button></li>
      <li><button id="btn-delete"><i class="fa-solid fa-trash"></i> Excluir Conta</button></li>
    </ul>
  </div>

  <!-- MENU DROPDOWN DE MAIS OPÇÕES -->
  <div class="dropdown-menu hidden" id="options-menu">
    <h3>Mais Opções</h3>
    <ul class="menu-list">
      <li><a href="#"><i class="fa-solid fa-circle-exclamation"></i> Mandar Reclamação</a></li>
      <li><a href="#"><i class="fa-solid fa-circle-question"></i> Ajuda</a></li>
      <li><a href="#"><i class="fa-solid fa-share-nodes"></i> Redes Sociais</a></li>
      <li><a href="#"><i class="fa-solid fa-shield-halved"></i> Denunciar Jogador</a></li>
    </ul>
  </div>

  <!-- VIEW 0: TELA DE LOGIN / AUTENTICAÇÃO -->
  <main class="view active" id="view-login">
    <div class="auth-card">
      <h2>Entrar no App</h2>
      <form id="login-form">
        <div class="input-group">
          <label for="login-email">E-mail ou Username</label>
          <input type="text" id="login-email" placeholder="seu@email.com" required>
        </div>
        <div class="input-group">
          <label for="login-password">Senha</label>
          <input type="password" id="login-password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-primary btn-full">Entrar</button>
      </form>
    </div>
  </main>

  <!-- VIEW 1: HOME / CARROSSEL DE JOGOS -->
  <main class="view hidden" id="view-home">
    <div class="carousel-container">
      <button class="carousel-btn" id="prev-btn"><i class="fa-solid fa-chevron-left"></i></button>
      
      <div class="card-display">
        <h2 id="game-title">Jogo da Velha</h2>
        <div class="card-frame" id="game-card">
          <div class="game-placeholder" id="game-preview-box">
            <i class="fa-solid fa-gamepad" id="game-icon"></i>
          </div>
        </div>
      </div>

      <button class="carousel-btn" id="next-btn"><i class="fa-solid fa-chevron-right"></i></button>
    </div>
  </main>

  <!-- VIEW 2: BUSCA DE USUÁRIOS -->
  <main class="view hidden" id="view-search">
    <button class="back-btn" id="btn-back-home"><i class="fa-solid fa-arrow-left"></i> Voltar</button>
    
    <div class="search-container">
      <label for="search-input">Digite o e-mail ou o nome de usuário que deseja buscar:</label>
      <div class="search-bar">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="search-input" placeholder="Ex: exemplo2111">
        <button id="btn-search">Buscar</button>
      </div>

      <div class="search-result hidden" id="search-result-card">
        <div class="result-item" id="user-result-item">
          <i class="fa-solid fa-circle-user"></i>
          <span id="result-username">exemplo2111</span>
        </div>
      </div>
    </div>
  </main>

  <!-- VIEW 3: PERFIL DO USUÁRIO ENCONTRADO -->
  <main class="view hidden" id="view-user-profile">
    <button class="back-btn" id="btn-back-search"><i class="fa-solid fa-arrow-left"></i> Voltar à Busca</button>
    
    <div class="profile-card">
      <i class="fa-solid fa-circle-user profile-avatar-large"></i>
      <h2 id="target-username">exemplo2111</h2>
      
      <div class="action-buttons">
        <button class="btn-primary"><i class="fa-solid fa-user-plus"></i> Adicionar Amizade</button>
        <button class="btn-secondary"><i class="fa-solid fa-envelope"></i> Mandar E-mail</button>
        <button class="btn-secondary"><i class="fa-solid fa-gamepad"></i> Chamar para Jogar</button>
        <button class="btn-danger-outline"><i class="fa-solid fa-flag"></i> Denunciar Perfil</button>
      </div>
    </div>
  </main>

  <script src="./script.js"></script>
</body>
</html>
