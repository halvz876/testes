<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plataforma de Jogos</title>
  <link rel="stylesheet" href="./estilo.css?v=3">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- CABEÇALHO / NAVBAR (Oculto na tela de login) -->
  <header class="navbar hidden" id="main-navbar">
    <div class="nav-left">
      <button class="icon-btn" id="btn-profile" title="Perfil">
        <i class="fa-solid fa-user"></i>
      </button>
      <button class="icon-btn" id="btn-search-page" title="Buscar">
        <i class="fa-solid fa-magnifying-glass"></i>
      </button>
    </div>

    <div class="nav-right">
      <div class="menu-container">
        <button class="icon-btn" id="btn-menu-options" title="Mais opções">
          <i class="fa-solid fa-ellipsis-vertical"></i>
        </button>
        <div id="dropdown-menu" class="dropdown-content hidden">
          <a href="https://docs.google.com/spreadsheets" target="_blank" id="menu-link-planilha" class="hidden">
            <i class="fa-solid fa-table"></i> Ver Planilha
          </a>
        </div>
      </div>
    </div>
  </header>

  <!-- MENU DROPDOWN DE PERFIL -->
  <div class="dropdown-menu hidden" id="profile-menu">
    <div class="user-info">
      <i class="fa-solid fa-circle-user profile-avatar"></i>
      <div>
        <h4 id="user-nickname">nickname</h4>
        <p id="user-email">email@gmail.com</p>
        <span class="status-online"><i class="fa-solid fa-circle"></i> Online</span>
      </div>
    </div>
    <hr>
    <ul class="menu-list danger-zone">
      <li><button id="btn-logout"><i class="fa-solid fa-right-from-bracket"></i> Sair da Conta</button></li>
    </ul>
  </div>

  <!-- VIEW 0: TELA DE LOGIN -->
  <main class="view active" id="view-login">
    <div class="auth-card">
      <h2>Entrar no App</h2>
      <form id="login-form">
        <div class="input-group">
          <label for="login-email">E-mail ou Username</label>
          <input type="text" id="login-email" placeholder="seu@email.com" required>
        </div>
        
        <div class="input-group password-group">
          <label for="login-password">Senha</label>
          <div class="password-wrapper">
            <input type="password" id="login-password" placeholder="••••••••" required>
            <i class="fa-solid fa-eye toggle-password" id="toggle-password"></i>
          </div>
        </div>

        <button type="submit" class="btn-primary btn-full" id="btn-login-submit">Entrar</button>
      </form>
    </div>
  </main>

  <!-- VIEW 1: HOME / DASHBOARD DE JOGOS -->
  <main class="view hidden" id="view-home">
    <div class="search-container">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="input-search" placeholder="Buscar jogo...">
      </div>
    </div>

    <div class="games-grid">
      <div class="game-card">
        <img src="ursinho.png" alt="Jogo da Memória" class="game-img">
        <h3>Jogo da Memória</h3>
        <button class="btn-primary btn-play">Jogar</button>
      </div>

      <div class="game-card">
        <img src="cobrinha.png" alt="Jogo da Cobrinha" class="game-img">
        <h3>Jogo da Cobrinha</h3>
        <button class="btn-primary btn-play">Jogar</button>
      </div>

      <div class="game-card">
        <img src="jogodaveia.png" alt="Jogo da Velha" class="game-img">
        <h3>Jogo da Velha</h3>
        <button class="btn-primary btn-play">Jogar</button>
      </div>

      <div class="game-card">
        <img src="passarim.png" alt="Flappy Bird" class="game-img">
        <h3>Flappy Bird</h3>
        <button class="btn-primary btn-play">Jogar</button>
      </div>
    </div>
  </main>

  <!-- VIEW 2: BUSCA DE USUÁRIOS -->
  <main class="view hidden" id="view-search">
    <button class="back-btn" id="btn-back-home"><i class="fa-solid fa-arrow-left"></i> Voltar</button>
    <div class="search-container">
      <label for="search-input">Digite o e-mail ou username do jogador:</label>
      <div class="search-bar">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="search-input" placeholder="Ex: exemplo2111">
        <button id="btn-search">Buscar</button>
      </div>
      <div class="search-result hidden" id="search-result-card">
        <div class="result-item" id="user-result-item">
          <i class="fa-solid fa-circle-user"></i>
          <span id="result-username">exemplo2111</span>
        </div>
      </div>
    </div>
  </main>

  <!-- VIEW 3: PERFIL DO USUÁRIO ENCONTRADO -->
  <main class="view hidden" id="view-user-profile">
    <button class="back-btn" id="btn-back-search"><i class="fa-solid fa-arrow-left"></i> Voltar à Busca</button>
    <div class="profile-card">
      <i class="fa-solid fa-circle-user profile-avatar-large"></i>
      <h2 id="target-username">exemplo2111</h2>
      <div class="action-buttons">
        <button class="btn-primary"><i class="fa-solid fa-user-plus"></i> Adicionar Amizade</button>
        <button class="btn-secondary"><i class="fa-solid fa-envelope"></i> Mandar E-mail</button>
      </div>
    </div>
  </main>

  <script src="./script.js?v=3"></script>
</body>
</html>
