<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plataforma de Jogos</title>
  <link rel="stylesheet" href="./estilo.css?v=5">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- NAVBAR / HEADER -->
  <header class="navbar hidden" id="main-navbar">
    <div class="nav-left">
      <div class="profile-container">
        <button class="icon-btn" id="btn-profile" title="Perfil">
          <i class="fa-solid fa-user"></i>
        </button>

        <!-- MENU DROPDOWN DE PERFIL -->
        <div class="dropdown-menu hidden" id="profile-menu">
          <div class="user-info">
            <i class="fa-solid fa-circle-user profile-avatar"></i>
            <div>
              <h4 id="user-nickname">nickname</h4>
              <p id="user-email">email@gmail.com</p>
              <span class="status-online"><i class="fa-solid fa-circle"></i> tempo on line</span>
            </div>
          </div>
          <hr class="dropdown-divider">
          <ul class="menu-list">
            <li><a href="#"><i class="fa-solid fa-envelope"></i> ver caixa de mensagens</a></li>
            <li><a href="#"><i class="fa-solid fa-user-plus"></i> adicionar amigo</a></li>
            <li><a href="#"><i class="fa-solid fa-users"></i> ver amigos</a></li>
            <li class="danger-item"><a href="#" id="btn-logout"><i class="fa-solid fa-right-from-bracket"></i> sair da conta</a></li>
            <li class="danger-item"><a href="#"><i class="fa-solid fa-user-slash"></i> excluir conta</a></li>
          </ul>
        </div>
      </div>
    </div>

    <div class="nav-right">
      <div class="menu-container">
        <button class="icon-btn" id="btn-menu-options" title="Mais opções">
          <i class="fa-solid fa-ellipsis-vertical"></i>
        </button>

        <!-- MENU 3 PONTINHOS -->
        <div id="dropdown-menu" class="dropdown-content hidden">
          <div class="dropdown-header">mais opções</div>
          <a href="#"><i class="fa-solid fa-comment-dots"></i> mandar reclamação</a>
          <a href="#"><i class="fa-solid fa-circle-question"></i> ajuda</a>
          <a href="#"><i class="fa-solid fa-share-nodes"></i> veja nossas redes sociais</a>
          <a href="#"><i class="fa-solid fa-triangle-exclamation"></i> denunciar jogador</a>
          <a href="https://docs.google.com/spreadsheets" target="_blank" id="menu-link-planilha" class="hidden">
            <i class="fa-solid fa-table"></i> ver planilha (ADM)
          </a>
        </div>
      </div>
    </div>
  </header>

  <!-- VIEW 0: LOGIN -->
  <main class="view active" id="view-login">
    <div class="auth-card">
      <h2>Entrar no App</h2>
      <form id="login-form">
        <div class="input-group">
          <label for="login-email">E-mail ou Username</label>
          <input type="text" id="login-email" placeholder="seu@email.com" required>
        </div>
        
        <div class="input-group password-group">
          <label for="login-password">Senha</label>
          <div class="password-wrapper">
            <input type="password" id="login-password" placeholder="••••••••" required>
            <i class="fa-solid fa-eye toggle-password" id="toggle-password"></i>
          </div>
        </div>

        <button type="submit" class="btn-primary btn-full" id="btn-login-submit">Entrar</button>
      </form>

      <!-- BOTÕES DE CRIAR E EXCLUIR CONTA -->
      <div class="auth-actions">
        <button type="button" class="btn-secondary" id="btn-create-account">Criar conta</button>
        <button type="button" class="btn-danger-link" id="btn-delete-account-login">Excluir conta</button>
      </div>
    </div>
  </main>

  <!-- VIEW 1: HOME / CARROSSEL DE JOGOS -->
  <main class="view hidden" id="view-home">
    <div class="search-container">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="input-search" placeholder="Buscar jogo ou usuário...">
      </div>
    </div>

    <div class="carousel-container">
      <button class="carousel-arrow" id="prev-btn"><i class="fa-solid fa-chevron-left"></i></button>

      <div class="carousel-card">
        <h3 id="game-title">Jogo da Memória</h3>
        <div class="img-wrapper">
          <img id="game-image" src="ursinho.png" alt="Jogo em destaque">
        </div>
        <button class="btn-primary btn-play">Jogar</button>
      </div>

      <button class="carousel-arrow" id="next-btn"><i class="fa-solid fa-chevron-right"></i></button>
    </div>
  </main>

  <script src="./script.js?v=5"></script>
</body>
</html>
