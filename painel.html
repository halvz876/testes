<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Usuários</title>
  <!-- Link do seu CSS principal -->
  <link rel="stylesheet" href="./estilo.css">
  <!-- Ícones do FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Estilos específicos para a tabela do painel */
    body {
      background-color: #1b1f2e;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 30px;
    }

    .container-painel {
      max-width: 950px;
      margin: 0 auto;
      background: #24293e;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 25px;
      color: #ffffff;
      text-transform: lowercase;
    }

    .tabela-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      background-color: #1b1f2e;
      color: #a0aec0;
      font-weight: 600;
      padding: 14px 16px;
      font-size: 14px;
      border-bottom: 2px solid #2d3748;
    }

    td {
      padding: 14px 16px;
      border-bottom: 1px solid #2d3748;
      font-size: 14px;
      color: #e2e8f0;
    }

    tr:hover {
      background-color: #2a3047;
    }

    /* Estilo do Botão de Excluir */
    .btn-excluir {
      background-color: #e53e3e;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }

    .btn-excluir:hover {
      background-color: #c53030;
    }

    .btn-excluir:disabled {
      background-color: #4a5568;
      cursor: not-allowed;
      opacity: 0.6;
    }

    /* Badge para Nível */
    .badge-nivel {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
    }
    .badge-usuario { background: #319795; color: white; }
    .badge-adm1 { background: #dd6b20; color: white; }
    .badge-adm2 { background: #805ad5; color: white; }
  </style>
</head>
<body>

  <div class="container-painel">
    <h1>planilha de usuarios cadastrados</h1>
    
    <div class="tabela-container">
      <table>
        <thead>
          <tr>
            <th>nome</th>
            <th>e-mail</th>
            <th>nível</th>
            <th>excluir (somente adm nível 2)</th>
          </tr>
        </thead>
        <tbody id="tabela-usuarios">
          <!-- Os usuários serão carregados dinamicamente via painel.js -->
        </tbody>
      </table>
    </div>
  </div>

  <script src="./firebase-config.js" type="module"></script>
  <script src="./painel.js" type="module"></script>
</body>
</html>
