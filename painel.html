<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planilha de Usuários Cadastrados</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body class="body-planilha">

    <div class="container-planilha">
        <!-- Banner Azul Topo -->
        <div class="header-planilha">
            <h1>planilha de usuarios cadastrados</h1>
        </div>

        <!-- Tabela Estilo Planilha -->
        <div class="tabela-wrapper">
            <table class="tabela-planilha">
                <thead>
                    <tr>
                        <th>nome</th>
                        <th>e-mail</th>
                        <th>nível</th>
                        <th>excluir (somente adm nível 2)</th>
                    </tr>
                </thead>
                <tbody id="tabelaUsuarios">
                    <!-- Os usuários carregados do Firebase entram aqui -->
                </tbody>
            </table>
        </div>
    </div>

    <script type="module" src="painel.js"></script>
</body>
</html>
