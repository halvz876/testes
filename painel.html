<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Usuários</title>
  <link rel="stylesheet" href="./estilo.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #1b1f2e;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 30px;
    }

    .container-painel {
      max-width: 950px;
      margin: 0 auto;
      background: #24293e;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 20px;
      color: #ffffff;
      text-transform: lowercase;
    }

    /* BARRA DE BUSCA E ORDENAÇÃO */
    .painel-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .search-box {
      position: relative;
      flex: 1;
      min-width: 250px;
    }

    .search-box i {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #a0aec0;
    }

    .search-box input {
      width: 100%;
      padding: 10px 10px 10px 38px;
      border-radius: 8px;
      border: 1px solid #2d3748;
      background-color: #1b1f2e;
      color: #ffffff;
      font-size: 14px;
      outline: none;
      box-sizing: border-box;
    }

    .search-box input:focus {
      border-color: #805ad5;
    }

    .sort-box {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: #a0aec0;
    }

    .sort-box select {
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid #2d3748;
      background-color: #1b1f2e;
      color: #ffffff;
      font-size: 14px;
      cursor: pointer;
      outline: none;
    }

    .tabela-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      background-color: #1b1f2e;
      color: #a0aec0;
      font-weight: 600;
      padding: 14px 16px;
      font-size: 14px;
      border-bottom: 2px solid #2d3748;
    }

    td {
      padding: 14px 16px;
      border-bottom: 1px solid #2d3748;
      font-size: 14px;
      color: #e2e8f0;
    }

    tr:hover {
      background-color: #2a3047;
    }

    .btn-excluir {
      background-color: #e53e3e;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }

    .btn-excluir:hover {
      background-color: #c53030;
    }

    .badge-nivel {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
    }
    .badge-usuario { background: #319795; color: white; }
    .badge-adm1 { background: #dd6b20; color: white; }
    .badge-adm2 { background: #805ad5; color: white; }
  </style>
</head>
<body>

  <div class="container-painel">
    <h1>planilha de usuarios cadastrados</h1>

    <!-- TOOLBAR COM LUPINHA E SELETOR -->
    <div class="painel-toolbar">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="input-busca-email" placeholder="Buscar por e-mail...">
      </div>

      <div class="sort-box">
        <label for="select-ordenar"><i class="fa-solid fa-sort"></i> Ordenar por:</label>
        <select id="select-ordenar">
          <option value="data-desc">Mais recentes primeiro</option>
          <option value="data-asc">Mais antigos primeiro</option>
          <option value="nome-asc">Nome (A-Z)</option>
          <option value="nome-desc">Nome (Z-A)</option>
        </select>
      </div>
    </div>
    
    <div class="tabela-container">
      <table>
        <thead>
          <tr>
            <th>nome</th>
            <th>e-mail</th>
            <th>nível</th>
            <th>excluir (somente adm nível 2)</th>
          </tr>
        </thead>
        <tbody id="tabela-usuarios">
          <!-- Carregado via painel.js -->
        </tbody>
      </table>
    </div>
  </div>

 <script src="./painel.js" type="module"></script>
</body>
</html>
